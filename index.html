<p>Праздничные периоды и сокращённые рабочие дни. События на весь день, без напоминаний.</p>
<p><a id="subscribe" href="calendar.ics">Подписаться в Apple Calendar</a> · <a href="calendar.ics">Скачать ICS</a></p>

const url = new URL('calendar.ics', location.href);
document.getElementById('address').textContent = url.href;
url.protocol = 'webcal:';
document.getElementById('subscribe').href = url.href;
</script>
